<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">A scripted expert turns known task state into a checked demonstration</title>
  <desc id="desc">Known object and target state enters an explicit phase program. The program chooses motion primitives and robot commands, producing an action-state trace, phase labels, and a programmatic success result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-small" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .stage { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 650 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 550 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .flow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .phase-flow { stroke: #64748b; stroke-width: 1.7; fill: none; marker-end: url(#arrow-small); }
      .robot { stroke: #334155; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .joint { fill: #ffffff; stroke: #334155; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Scripted expert: explicit rules generate the demonstration</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">No operator chooses every step, and no policy must be trained first.</text>

  <rect x="40" y="112" width="226" height="366" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="64" y="148" class="stage">1 · Read task state</text>
  <rect x="68" y="178" width="170" height="126" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <path d="M84 276 H222" stroke="#94a3b8" stroke-width="3"/>
  <path d="M101 238 L126 226 L151 238 V267 H101 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <path d="M101 238 L126 250 L151 238 M126 250 V267" stroke="#a16207" stroke-width="2" fill="none"/>
  <circle cx="198" cy="247" r="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M186 247 H210 M198 235 V259" stroke="#0284c7" stroke-width="2"/>
  <path d="M114 211 V230 M198 205 V230" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="114" cy="207" r="4" fill="#2563eb"/>
  <circle cx="198" cy="201" r="4" fill="#2563eb"/>
  <text x="153" y="329" text-anchor="middle" class="label">known task state</text>
  <g class="small">
    <circle cx="76" cy="360" r="4" fill="#2563eb"/><text x="90" y="365">robot + object state</text>
    <circle cx="76" cy="389" r="4" fill="#2563eb"/><text x="90" y="394">goal or subtask</text>
    <circle cx="76" cy="418" r="4" fill="#2563eb"/><text x="90" y="423">task parameters</text>
    <circle cx="76" cy="447" r="4" fill="#2563eb"/><text x="90" y="452">transition + success rules</text>
  </g>

  <path d="M266 295 H304" class="flow"/>

  <rect x="314" y="112" width="354" height="366" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="338" y="148" class="stage">2 · Apply the phase program</text>
  <rect x="342" y="172" width="298" height="58" rx="12" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="491" y="195" text-anchor="middle" class="label">state + current phase</text>
  <text x="491" y="216" text-anchor="middle" class="small">→ subgoal · primitive · transition rule</text>

  <g>
    <rect x="342" y="258" width="62" height="34" rx="9" fill="#ede9fe"/><text x="373" y="280" text-anchor="middle" class="tiny">initialize</text>
    <path d="M410 275 H419" class="phase-flow"/>
    <rect x="424" y="258" width="62" height="34" rx="9" fill="#ede9fe"/><text x="455" y="280" text-anchor="middle" class="tiny">approach</text>
    <path d="M492 275 H501" class="phase-flow"/>
    <rect x="506" y="258" width="52" height="34" rx="9" fill="#ede9fe"/><text x="532" y="280" text-anchor="middle" class="tiny">act</text>
    <path d="M564 275 H573" class="phase-flow"/>
    <rect x="578" y="258" width="62" height="34" rx="9" fill="#ede9fe"/><text x="609" y="280" text-anchor="middle" class="tiny">verify</text>
  </g>
  <path d="M609 292 V309 H491 V324" class="phase-flow"/>
  <rect x="426" y="325" width="130" height="42" rx="10" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="491" y="351" text-anchor="middle" class="label">transition met?</text>
  <path d="M491 367 V384 M388 384 H545" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M388 384 V407" class="phase-flow"/>
  <path d="M545 384 V407" class="phase-flow"/>
  <text x="439" y="379" text-anchor="middle" class="tiny">yes</text>
  <text x="518" y="379" text-anchor="middle" class="tiny">no</text>
  <rect x="342" y="408" width="92" height="34" rx="9" fill="#dcfce7"/><text x="388" y="430" text-anchor="middle" class="tiny">next phase</text>
  <rect x="458" y="408" width="174" height="34" rx="9" fill="#fef3c7"/><text x="545" y="430" text-anchor="middle" class="tiny">retry · recover · stop</text>
  <text x="491" y="466" text-anchor="middle" class="small">Explicit, inspectable rules—not a learned policy</text>

  <path d="M668 295 H706" class="flow"/>

  <rect x="716" y="112" width="204" height="366" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="740" y="148" class="stage">3 · Execute</text>
  <rect x="750" y="388" width="136" height="18" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
  <path d="M779 388 L781 346 L813 309 L790 268 L837 235" class="robot"/>
  <circle cx="781" cy="346" r="9" class="joint"/>
  <circle cx="813" cy="309" r="9" class="joint"/>
  <circle cx="790" cy="268" r="9" class="joint"/>
  <path d="M837 235 L850 222 M837 235 L853 243" class="robot"/>
  <path d="M756 203 H876" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="818" y="190" text-anchor="middle" class="small">commanded target</text>
  <text x="818" y="431" text-anchor="middle" class="label">robot / simulator</text>
  <text x="818" y="454" text-anchor="middle" class="small">control + step</text>

  <path d="M920 295 H958" class="flow"/>

  <rect x="968" y="112" width="192" height="366" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="992" y="148" class="stage">4 · Keep evidence</text>
  <rect x="994" y="178" width="140" height="88" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <path d="M1010 244 C1028 231 1032 198 1050 214 S1080 249 1118 200" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M1010 226 C1033 208 1048 247 1070 232 S1100 214 1118 225" stroke="#10b981" stroke-width="3" fill="none"/>
  <text x="1064" y="289" text-anchor="middle" class="label">action / state trace</text>
  <rect x="994" y="316" width="140" height="42" rx="10" fill="#f3e8ff"/>
  <text x="1064" y="342" text-anchor="middle" class="label">phase labels</text>
  <rect x="994" y="380" width="140" height="58" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1064" y="404" text-anchor="middle" class="label">success?</text>
  <text x="1064" y="426" text-anchor="middle" class="small">programmatic check</text>

  <rect x="40" y="506" width="546" height="92" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="64" y="538" class="label">Why it is useful</text>
  <text x="64" y="562" class="small">Repeatable behavior · phase-level diagnosis · automatic outcome checks</text>
  <text x="64" y="584" class="small">Low-cost reruns after the script exists</text>
  <rect x="614" y="506" width="546" height="92" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="638" y="538" class="label">Why it can break</text>
  <text x="638" y="562" class="small">Task-specific rules · privileged state</text>
  <text x="638" y="584" class="small">Brittle outside modeled geometry and contacts</text>
</svg>
