<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Seven-phase scripted pick-and-place expert</title>
  <desc id="desc">After scene settling, the expert executes pregrasp, descend, grasp, lift, transport, release, and retreat in order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526078; }
      .phase-number { font: 700 14px Arial, sans-serif; fill: #475569; }
      .phase-name { font: 700 18px Arial, sans-serif; fill: #172033; }
      .phase-detail { font: 14px Arial, sans-serif; fill: #526078; }
      .settle { font: 600 14px Arial, sans-serif; fill: #475569; }
      .footer { font: 600 15px Arial, sans-serif; fill: #334155; }
      .flow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="360" rx="24" fill="#f8fafc"/>
  <text x="700" y="42" text-anchor="middle" class="title">Seven-phase scripted expert</text>
  <text x="700" y="70" text-anchor="middle" class="subtitle">Each phase turns task intent into a specific target, control mode, and observable event.</text>

  <rect x="28" y="91" width="210" height="40" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="133" y="116" text-anchor="middle" class="settle">Settle scene · preparation</text>
  <path d="M 238 111 H 265" class="flow"/>

  <g transform="translate(270 92)">
    <rect width="150" height="150" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="18" y="28" class="phase-number">1</text>
    <text x="75" y="61" text-anchor="middle" class="phase-name">Pregrasp</text>
    <text x="75" y="92" text-anchor="middle" class="phase-detail">plan above</text>
    <text x="75" y="114" text-anchor="middle" class="phase-detail">open gripper</text>
  </g>
  <path d="M 420 167 H 444" class="flow"/>

  <g transform="translate(449 92)">
    <rect width="150" height="150" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="18" y="28" class="phase-number">2</text>
    <text x="75" y="61" text-anchor="middle" class="phase-name">Descend</text>
    <text x="75" y="92" text-anchor="middle" class="phase-detail">fixed xy</text>
    <text x="75" y="114" text-anchor="middle" class="phase-detail">descending z</text>
  </g>
  <path d="M 599 167 H 623" class="flow"/>

  <g transform="translate(628 92)">
    <rect width="150" height="150" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="18" y="28" class="phase-number">3</text>
    <text x="75" y="61" text-anchor="middle" class="phase-name">Grasp</text>
    <text x="75" y="92" text-anchor="middle" class="phase-detail">hold arm</text>
    <text x="75" y="114" text-anchor="middle" class="phase-detail">finger force</text>
  </g>
  <path d="M 778 167 H 802" class="flow"/>

  <g transform="translate(807 92)">
    <rect width="150" height="150" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="18" y="28" class="phase-number">4</text>
    <text x="75" y="61" text-anchor="middle" class="phase-name">Lift</text>
    <text x="75" y="92" text-anchor="middle" class="phase-detail">clear table</text>
    <text x="75" y="114" text-anchor="middle" class="phase-detail">bounded target</text>
  </g>
  <path d="M 957 167 H 981" class="flow"/>

  <g transform="translate(986 92)">
    <rect width="150" height="150" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <text x="18" y="28" class="phase-number">5</text>
    <text x="75" y="61" text-anchor="middle" class="phase-name">Transport</text>
    <text x="75" y="92" text-anchor="middle" class="phase-detail">move to bowl</text>
    <text x="75" y="114" text-anchor="middle" class="phase-detail">maintain force</text>
  </g>
  <path d="M 1136 167 H 1160" class="flow"/>

  <g transform="translate(1165 92)">
    <rect width="100" height="150" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="16" y="28" class="phase-number">6</text>
    <text x="50" y="61" text-anchor="middle" class="phase-name">Release</text>
    <text x="50" y="92" text-anchor="middle" class="phase-detail">open</text>
    <text x="50" y="114" text-anchor="middle" class="phase-detail">fingers</text>
  </g>
  <path d="M 1265 167 H 1284" class="flow"/>

  <g transform="translate(1289 92)">
    <rect width="83" height="150" rx="16" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <text x="14" y="28" class="phase-number">7</text>
    <text x="41.5" y="61" text-anchor="middle" class="phase-name" font-size="16">Retreat</text>
    <text x="41.5" y="92" text-anchor="middle" class="phase-detail">move</text>
    <text x="41.5" y="114" text-anchor="middle" class="phase-detail">and settle</text>
  </g>

  <rect x="210" y="278" width="980" height="48" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="307" text-anchor="middle" class="footer">task intent → pose targets → arm / finger commands → measured motion → containment result</text>
</svg>
