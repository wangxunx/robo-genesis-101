[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-genesis-101"
version = "0.1.0"
description = "A practical open-source course on robot learning workflows with Genesis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "av==15.1.0",
    "genesis-world==1.3.3",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "llvmlite==0.48.0",
    "matplotlib==3.11.1",
    "numba==0.66.0",
    "numpy==2.2.6",
    "opencv-python==5.0.0.93",
    "trimesh==5.0.0",
]

[project.scripts]
robo-genesis-validate = "robo_genesis.course_validation:main"

[project.optional-dependencies]
data = [
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
    "pyarrow==25.0.0",
]
training = [
    "accelerate==1.14.0",
    "lerobot[smolvla,training]==0.6.0",
    "num2words==0.5.14",
    "pyarrow==25.0.0",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "transformers==5.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
# Keep the portable PyPI resolution on the same public release line as the
# separately installed AMD ROCm wheels. The AMD torchvision 0.24.0 wheel is
# built for AMD's torch 2.9.1 wheel, while PyPI torchvision 0.24.0 declares
# torch==2.9.0; exact backend artifacts therefore remain a separate install.
constraint-dependencies = [
    "torch>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
