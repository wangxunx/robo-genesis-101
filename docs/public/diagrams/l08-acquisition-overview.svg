<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demonstration acquisition routes and adapters</title>
  <desc id="desc">Six native demonstration sources pass through source-specific adapters before reaching a shared task, observation, action, and outcome interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 650 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Different sources need different adapters</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">A shared learning interface is the result of conversion—not a native property of the source.</text>

  <text x="40" y="116" class="heading">Native source</text>
  <text x="390" y="116" class="heading">Source-specific adapter</text>
  <text x="825" y="116" class="heading">Demonstration interface</text>

  <g>
    <rect x="40" y="138" width="275" height="72" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="58" y="166" class="label">Teleoperation</text>
    <text x="58" y="190" class="small">interface commands + robot sensors</text>
    <rect x="390" y="138" width="305" height="72" rx="12" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="408" y="166" class="label">Control mapping + clocks</text>
    <text x="408" y="190" class="small">calibration, synchronization, QC</text>
    <path d="M315 174 H382" class="arrow"/>
  </g>

  <g>
    <rect x="40" y="226" width="275" height="72" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="58" y="254" class="label">Kinesthetic teaching</text>
    <text x="58" y="278" class="small">physically guided robot trajectory</text>
    <rect x="390" y="226" width="305" height="72" rx="12" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="408" y="254" class="label">Replay action + safety</text>
    <text x="408" y="278" class="small">convert compliant teaching motion</text>
    <path d="M315 262 H382" class="arrow"/>
  </g>

  <g>
    <rect x="40" y="314" width="275" height="72" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <text x="58" y="342" class="label">Scripted expert</text>
    <text x="58" y="366" class="small">task state + motion primitives</text>
    <rect x="390" y="314" width="305" height="72" rx="12" fill="#ecfccb" stroke="#84cc16"/>
    <text x="408" y="342" class="label">Phase + failure contract</text>
    <text x="408" y="366" class="small">recorder hook and outcome check</text>
    <path d="M315 350 H382" class="arrow"/>
  </g>

  <g>
    <rect x="40" y="402" width="275" height="72" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <text x="58" y="430" class="label">Privileged learned teacher</text>
    <text x="58" y="454" class="small">teacher action + simulator state</text>
    <rect x="390" y="402" width="305" height="72" rx="12" fill="#ecfccb" stroke="#84cc16"/>
    <text x="408" y="430" class="label">Observation restriction</text>
    <text x="408" y="454" class="small">distillation or executable recollection</text>
    <path d="M315 438 H382" class="arrow"/>
  </g>

  <g>
    <rect x="40" y="490" width="275" height="72" rx="12" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="58" y="518" class="label">Automatic augmentation</text>
    <text x="58" y="542" class="small">transformed seed trajectories</text>
    <rect x="390" y="490" width="305" height="72" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="408" y="518" class="label">Replay + success filtering</text>
    <text x="408" y="542" class="small">reject physically invalid candidates</text>
    <path d="M315 526 H382" class="arrow"/>
  </g>

  <g>
    <rect x="40" y="578" width="275" height="72" rx="12" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="58" y="606" class="label">Human-video transfer</text>
    <text x="58" y="630" class="small">pixels + estimated object motion</text>
    <rect x="390" y="578" width="305" height="72" rx="12" fill="#faf5ff" stroke="#a855f7"/>
    <text x="408" y="606" class="label">Embodiment mapping</text>
    <text x="408" y="630" class="small">geometry, actions, executability</text>
    <path d="M315 614 H382" class="arrow"/>
  </g>

  <path d="M695 174 H760 V394 H812" class="arrow"/>
  <path d="M695 262 H760 V394 H812" class="arrow"/>
  <path d="M695 350 H760 V394 H812" class="arrow"/>
  <path d="M695 438 H760 V394 H812" class="arrow"/>
  <path d="M695 526 H760 V394 H812" class="arrow"/>
  <path d="M695 614 H760 V394 H812" class="arrow"/>

  <rect x="820" y="258" width="340" height="272" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="990" y="298" text-anchor="middle" class="heading">Shared demonstration contract</text>
  <rect x="858" y="326" width="264" height="38" rx="8" fill="#eff6ff"/>
  <text x="990" y="351" text-anchor="middle" class="label">task context</text>
  <rect x="858" y="376" width="264" height="38" rx="8" fill="#eff6ff"/>
  <text x="990" y="401" text-anchor="middle" class="label">observation</text>
  <rect x="858" y="426" width="264" height="38" rx="8" fill="#eff6ff"/>
  <text x="990" y="451" text-anchor="middle" class="label">robot action</text>
  <rect x="858" y="476" width="264" height="38" rx="8" fill="#eff6ff"/>
  <text x="990" y="501" text-anchor="middle" class="label">outcome</text>

  <text x="600" y="708" text-anchor="middle" class="subtitle">L08 chooses the scripted route; L09 defines the concrete temporal and storage schema.</text>
</svg>
