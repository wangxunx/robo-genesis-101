<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">脚本化专家把已知任务状态转换成经过检查的演示</title>
  <desc id="desc">已知的物体与目标状态进入显式阶段程序，程序选择运动基元和机器人命令，最终得到动作状态轨迹、阶段标签与程序化成功判定。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-small" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .stage { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 650 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 550 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .flow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .phase-flow { stroke: #64748b; stroke-width: 1.7; fill: none; marker-end: url(#arrow-small); }
      .robot { stroke: #334155; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .joint { fill: #ffffff; stroke: #334155; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">脚本化专家：用显式规则生成演示</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">不需要人逐步选择动作，也不需要先训练一个策略。</text>

  <rect x="40" y="112" width="226" height="366" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="64" y="148" class="stage">1 · 读取任务状态</text>
  <rect x="68" y="178" width="170" height="126" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <path d="M84 276 H222" stroke="#94a3b8" stroke-width="3"/>
  <path d="M101 238 L126 226 L151 238 V267 H101 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <path d="M101 238 L126 250 L151 238 M126 250 V267" stroke="#a16207" stroke-width="2" fill="none"/>
  <circle cx="198" cy="247" r="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M186 247 H210 M198 235 V259" stroke="#0284c7" stroke-width="2"/>
  <path d="M114 211 V230 M198 205 V230" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="114" cy="207" r="4" fill="#2563eb"/>
  <circle cx="198" cy="201" r="4" fill="#2563eb"/>
  <text x="153" y="329" text-anchor="middle" class="label">已知任务状态</text>
  <g class="small">
    <circle cx="76" cy="360" r="4" fill="#2563eb"/><text x="90" y="365">机器人与物体状态</text>
    <circle cx="76" cy="389" r="4" fill="#2563eb"/><text x="90" y="394">目标或子任务</text>
    <circle cx="76" cy="418" r="4" fill="#2563eb"/><text x="90" y="423">任务参数</text>
    <circle cx="76" cy="447" r="4" fill="#2563eb"/><text x="90" y="452">转换与成功规则</text>
  </g>

  <path d="M266 295 H304" class="flow"/>

  <rect x="314" y="112" width="354" height="366" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="338" y="148" class="stage">2 · 执行阶段程序</text>
  <rect x="342" y="172" width="298" height="58" rx="12" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="491" y="195" text-anchor="middle" class="label">状态 + 当前阶段</text>
  <text x="491" y="216" text-anchor="middle" class="small">→ 子目标 · 运动基元 · 转换规则</text>

  <g>
    <rect x="342" y="258" width="62" height="34" rx="9" fill="#ede9fe"/><text x="373" y="280" text-anchor="middle" class="tiny">初始化</text>
    <path d="M410 275 H419" class="phase-flow"/>
    <rect x="424" y="258" width="62" height="34" rx="9" fill="#ede9fe"/><text x="455" y="280" text-anchor="middle" class="tiny">接近</text>
    <path d="M492 275 H501" class="phase-flow"/>
    <rect x="506" y="258" width="52" height="34" rx="9" fill="#ede9fe"/><text x="532" y="280" text-anchor="middle" class="tiny">执行</text>
    <path d="M564 275 H573" class="phase-flow"/>
    <rect x="578" y="258" width="62" height="34" rx="9" fill="#ede9fe"/><text x="609" y="280" text-anchor="middle" class="tiny">验证</text>
  </g>
  <path d="M609 292 V309 H491 V324" class="phase-flow"/>
  <rect x="426" y="325" width="130" height="42" rx="10" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="491" y="351" text-anchor="middle" class="label">转换条件满足？</text>
  <path d="M491 367 V384 M388 384 H545" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M388 384 V407" class="phase-flow"/>
  <path d="M545 384 V407" class="phase-flow"/>
  <text x="439" y="379" text-anchor="middle" class="tiny">是</text>
  <text x="518" y="379" text-anchor="middle" class="tiny">否</text>
  <rect x="342" y="408" width="92" height="34" rx="9" fill="#dcfce7"/><text x="388" y="430" text-anchor="middle" class="tiny">进入下一阶段</text>
  <rect x="458" y="408" width="174" height="34" rx="9" fill="#fef3c7"/><text x="545" y="430" text-anchor="middle" class="tiny">重试 · 恢复 · 停止</text>
  <text x="491" y="466" text-anchor="middle" class="small">规则显式、可检查，不是学习得到的策略</text>

  <path d="M668 295 H706" class="flow"/>

  <rect x="716" y="112" width="204" height="366" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="740" y="148" class="stage">3 · 执行动作</text>
  <rect x="750" y="388" width="136" height="18" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
  <path d="M779 388 L781 346 L813 309 L790 268 L837 235" class="robot"/>
  <circle cx="781" cy="346" r="9" class="joint"/>
  <circle cx="813" cy="309" r="9" class="joint"/>
  <circle cx="790" cy="268" r="9" class="joint"/>
  <path d="M837 235 L850 222 M837 235 L853 243" class="robot"/>
  <path d="M756 203 H876" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="818" y="190" text-anchor="middle" class="small">命令目标</text>
  <text x="818" y="431" text-anchor="middle" class="label">机器人 / 仿真器</text>
  <text x="818" y="454" text-anchor="middle" class="small">控制并推进仿真</text>

  <path d="M920 295 H958" class="flow"/>

  <rect x="968" y="112" width="192" height="366" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="992" y="148" class="stage">4 · 保留证据</text>
  <rect x="994" y="178" width="140" height="88" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <path d="M1010 244 C1028 231 1032 198 1050 214 S1080 249 1118 200" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M1010 226 C1033 208 1048 247 1070 232 S1100 214 1118 225" stroke="#10b981" stroke-width="3" fill="none"/>
  <text x="1064" y="289" text-anchor="middle" class="label">动作 / 状态轨迹</text>
  <rect x="994" y="316" width="140" height="42" rx="10" fill="#f3e8ff"/>
  <text x="1064" y="342" text-anchor="middle" class="label">阶段标签</text>
  <rect x="994" y="380" width="140" height="58" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1064" y="404" text-anchor="middle" class="label">是否成功？</text>
  <text x="1064" y="426" text-anchor="middle" class="small">程序化检查</text>

  <rect x="40" y="506" width="546" height="92" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="64" y="538" class="label">为什么有用</text>
  <text x="64" y="562" class="small">行为可复现 · 可按阶段诊断 · 自动检查结果</text>
  <text x="64" y="584" class="small">脚本写好后可以低成本重复执行</text>
  <rect x="614" y="506" width="546" height="92" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="638" y="538" class="label">为什么会失效</text>
  <text x="638" y="562" class="small">依赖任务特定规则与特权状态</text>
  <text x="638" y="584" class="small">超出建模几何或接触假设后容易失效</text>
</svg>
