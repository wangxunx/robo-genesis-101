<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Automatic augmentation expands trusted demonstrations through transformation, replay, and filtering</title>
  <desc id="desc">A trusted seed demonstration is transformed into multiple candidate trajectories. Each candidate is replayed with physics and contact, then accepted or rejected using task and data-quality checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .stage { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 650 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 550 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .flow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .robot { stroke: #334155; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .joint { fill: #ffffff; stroke: #334155; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Automatic augmentation: transform, replay, then filter</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">A geometric transformation creates a candidate—not yet a valid demonstration.</text>

  <rect x="40" y="112" width="220" height="354" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="64" y="148" class="stage">1 · Trusted seed</text>
  <rect x="68" y="178" width="164" height="142" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <path d="M88 275 C111 226 147 239 166 204 S200 210 214 188" stroke="#2563eb" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <circle cx="88" cy="275" r="7"/><circle cx="130" cy="237" r="7"/><circle cx="172" cy="196" r="7"/><circle cx="214" cy="188" r="7"/>
  </g>
  <text x="150" y="306" text-anchor="middle" class="tiny">observed successful sequence</text>
  <text x="150" y="349" text-anchor="middle" class="label">one or a few episodes</text>
  <g class="small">
    <circle cx="76" cy="382" r="4" fill="#2563eb"/><text x="90" y="387">task structure</text>
    <circle cx="76" cy="412" r="4" fill="#2563eb"/><text x="90" y="417">phase boundaries</text>
    <circle cx="76" cy="442" r="4" fill="#2563eb"/><text x="90" y="447">known success</text>
  </g>

  <path d="M260 289 H292" class="flow"/>

  <rect x="300" y="112" width="260" height="354" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="324" y="148" class="stage">2 · Generate candidates</text>
  <text x="430" y="178" text-anchor="middle" class="small">task-valid geometric transforms</text>
  <circle cx="430" cy="207" r="9" fill="#7c3aed"/>
  <path d="M430 216 V232 M430 232 H354 V244 M430 232 V244 M430 232 H506 V244" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <g>
    <rect x="324" y="244" width="68" height="76" rx="10" fill="#ffffff" stroke="#d8b4fe"/>
    <rect x="334" y="286" width="48" height="3" fill="#94a3b8"/>
    <rect x="338" y="267" width="14" height="14" rx="2" fill="#facc15" stroke="#a16207"/>
    <circle cx="374" cy="273" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-dasharray="3 2"/>
    <text x="358" y="310" text-anchor="middle" class="tiny">A</text>
    <rect x="396" y="244" width="68" height="76" rx="10" fill="#ffffff" stroke="#d8b4fe"/>
    <rect x="406" y="286" width="48" height="3" fill="#94a3b8"/>
    <rect x="432" y="263" width="14" height="14" rx="2" fill="#facc15" stroke="#a16207"/>
    <circle cx="416" cy="276" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-dasharray="3 2"/>
    <text x="430" y="310" text-anchor="middle" class="tiny">B</text>
    <rect x="468" y="244" width="68" height="76" rx="10" fill="#ffffff" stroke="#d8b4fe"/>
    <rect x="478" y="286" width="48" height="3" fill="#94a3b8"/>
    <rect x="486" y="259" width="14" height="14" rx="2" fill="#facc15" stroke="#a16207"/>
    <circle cx="518" cy="278" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-dasharray="3 2"/>
    <text x="502" y="310" text-anchor="middle" class="tiny">C</text>
  </g>
  <text x="430" y="354" text-anchor="middle" class="label">new scene configurations</text>
  <text x="430" y="383" text-anchor="middle" class="small">object pose · target pose</text>
  <text x="430" y="407" text-anchor="middle" class="small">reusable task segments</text>
  <rect x="348" y="426" width="164" height="26" rx="13" fill="#ede9fe"/>
  <text x="430" y="444" text-anchor="middle" class="tiny">candidate trajectories only</text>

  <path d="M560 289 H592" class="flow"/>

  <rect x="600" y="112" width="260" height="354" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="624" y="148" class="stage">3 · Replay with physics</text>
  <g>
    <rect x="624" y="178" width="48" height="28" rx="8" fill="#ede9fe"/><text x="648" y="197" text-anchor="middle" class="tiny">A</text>
    <rect x="682" y="178" width="48" height="28" rx="8" fill="#ede9fe"/><text x="706" y="197" text-anchor="middle" class="tiny">B</text>
    <rect x="740" y="178" width="48" height="28" rx="8" fill="#ede9fe"/><text x="764" y="197" text-anchor="middle" class="tiny">C</text>
  </g>
  <path d="M648 214 H788" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="661" y="373" width="138" height="16" rx="5" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
  <path d="M692 373 L693 333 L725 301 L701 264 L756 242" class="robot"/>
  <circle cx="693" cy="333" r="8" class="joint"/>
  <circle cx="725" cy="301" r="8" class="joint"/>
  <circle cx="701" cy="264" r="8" class="joint"/>
  <path d="M756 242 L768 230 M756 242 L771 249" class="robot"/>
  <text x="730" y="415" text-anchor="middle" class="label">execute each candidate</text>
  <text x="730" y="440" text-anchor="middle" class="small">contact · dynamics · controller</text>

  <path d="M860 289 H892" class="flow"/>

  <rect x="900" y="112" width="260" height="354" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="924" y="148" class="stage">4 · Filter outcomes</text>
  <g>
    <rect x="928" y="184" width="204" height="48" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="948" y="214" class="label">candidate A</text>
    <circle cx="1103" cy="208" r="15" fill="#dcfce7" stroke="#22c55e"/><path d="M1096 208 L1101 213 L1110 201" stroke="#15803d" stroke-width="3" fill="none"/>
    <rect x="928" y="248" width="204" height="48" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="948" y="278" class="label">candidate B</text>
    <circle cx="1103" cy="272" r="15" fill="#fee2e2" stroke="#f87171"/><path d="M1096 265 L1110 279 M1110 265 L1096 279" stroke="#dc2626" stroke-width="3"/>
    <rect x="928" y="312" width="204" height="48" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="948" y="342" class="label">candidate C</text>
    <circle cx="1103" cy="336" r="15" fill="#dcfce7" stroke="#22c55e"/><path d="M1096 336 L1101 341 L1110 329" stroke="#15803d" stroke-width="3" fill="none"/>
  </g>
  <text x="1030" y="397" text-anchor="middle" class="label">accepted episodes</text>
  <text x="1030" y="422" text-anchor="middle" class="small">task success + data quality</text>
  <text x="1030" y="447" text-anchor="middle" class="tiny">failures are rejected, not relabeled</text>

  <rect x="40" y="496" width="546" height="88" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="64" y="528" class="label">What creates scale</text>
  <text x="64" y="555" class="small">One trusted seed → many transformed, replayed, checked variations</text>
  <rect x="614" y="496" width="546" height="88" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="638" y="528" class="label">What preserves validity</text>
  <text x="638" y="555" class="small">Physical execution + outcome checks—not geometric transformation alone</text>
</svg>
