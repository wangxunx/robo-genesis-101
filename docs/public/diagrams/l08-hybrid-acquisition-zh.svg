<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">扩展机器人演示数据的混合式路线</title>
  <desc id="desc">高价值人工演示、仿真生成和更广泛的视觉经验经过执行与质量门禁，再汇入异构数据混合。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; fill: #0f172a; }
      .label { font: 650 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="590" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">近期演示数据系统正在组合互补来源</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">只有本体、执行、时序与结果保持明确，扩大数据规模才有意义。</text>

  <rect x="42" y="132" width="244" height="112" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="164" y="164" text-anchor="middle" class="heading">人工引导的 seed</text>
  <text x="164" y="194" text-anchor="middle" class="small">遥操作</text>
  <text x="164" y="218" text-anchor="middle" class="small">拖动示教 / 便携采集</text>

  <rect x="42" y="300" width="244" height="112" rx="16" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="164" y="332" text-anchor="middle" class="heading">更广泛的经验</text>
  <text x="164" y="362" text-anchor="middle" class="small">人类与第一视角视频</text>
  <text x="164" y="386" text-anchor="middle" class="small">异构机器人数据集</text>

  <rect x="355" y="132" width="244" height="280" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="477" y="168" text-anchor="middle" class="heading">自动扩展</text>
  <rect x="385" y="194" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="477" y="222" text-anchor="middle" class="label">脚本化专家</text>
  <rect x="385" y="256" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="477" y="284" text-anchor="middle" class="label">学习型专家</text>
  <rect x="385" y="318" width="184" height="60" rx="8" fill="#ffffff"/>
  <text x="477" y="343" text-anchor="middle" class="label">基于 seed 的</text>
  <text x="477" y="364" text-anchor="middle" class="label">自动扩增</text>

  <rect x="668" y="132" width="244" height="280" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="790" y="168" text-anchor="middle" class="heading">质量门禁</text>
  <rect x="698" y="194" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="790" y="222" text-anchor="middle" class="label">retarget + 重放</text>
  <rect x="698" y="256" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="790" y="284" text-anchor="middle" class="label">物理执行</text>
  <rect x="698" y="318" width="184" height="60" rx="8" fill="#ffffff"/>
  <text x="790" y="343" text-anchor="middle" class="label">结果 + 数据</text>
  <text x="790" y="364" text-anchor="middle" class="label">质量检查</text>

  <rect x="981" y="132" width="177" height="280" rx="16" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1069" y="168" text-anchor="middle" class="heading">验收后的混合</text>
  <text x="1069" y="211" text-anchor="middle" class="small">机器人原生动作</text>
  <text x="1069" y="239" text-anchor="middle" class="small">对齐后的观察</text>
  <text x="1069" y="267" text-anchor="middle" class="small">任务 metadata</text>
  <text x="1069" y="295" text-anchor="middle" class="small">结果标签</text>
  <line x1="1009" y1="322" x2="1129" y2="322" stroke="#7dd3fc" stroke-width="2"/>
  <text x="1069" y="352" text-anchor="middle" class="small">只有语义明确时</text>
  <text x="1069" y="376" text-anchor="middle" class="small">才能汇聚</text>
  <text x="1069" y="398" text-anchor="middle" class="small">跨本体数据</text>

  <path d="M286 188 H347" class="arrow"/>
  <path d="M286 356 H320 V360 H347" class="arrow"/>
  <path d="M599 272 H660" class="arrow"/>
  <path d="M912 272 H973" class="arrow"/>

  <rect x="315" y="465" width="570" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <text x="600" y="494" text-anchor="middle" class="label">迭代闭环</text>
  <text x="600" y="518" text-anchor="middle" class="small">失败和未覆盖任务决定下一条人工 seed、脚本或 teacher</text>
  <path d="M1069 420 V500 H894" class="arrow"/>
  <path d="M306 500 H164 V421" class="arrow"/>

  <text x="600" y="567" text-anchor="middle" class="subtitle">L08 研究一条透明的脚本分支；后续课程再定义存储与策略使用。</text>
</svg>
