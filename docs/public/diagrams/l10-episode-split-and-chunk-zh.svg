<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Episode 边界同时约束评估划分与未来 action chunk</title>
  <desc id="desc">上半部分把完整 episode 分配给训练或评估，并与会发生泄漏的随机 frame 划分对照。下半部分展示 episode 中段的四步 action window，以及最后一帧处被标记为 padding 的边界重复值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .cross { stroke: #e11d48; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="800" rx="24" fill="#f8fafc"/>
  <text x="700" y="43" text-anchor="middle" class="title">Episode 边界保护两种不同合同</text>
  <text x="700" y="73" text-anchor="middle" class="subtitle">它既隔离评估 trajectory，也把未来 action target 留在同一次 rollout 内。</text>

  <rect x="30" y="102" width="1340" height="292" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="55" y="136" class="section">A · 训练/评估划分</text>

  <text x="70" y="178" class="label">正确：按完整 episode 分配</text>
  <text x="70" y="204" class="small">同一 task · 确定性 episode ID · 不共享 frame</text>

  <text x="75" y="245" class="code">episode 0</text>
  <rect x="170" y="224" width="430" height="35" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="256" y1="225" x2="256" y2="258" stroke="#93c5fd"/>
  <line x1="342" y1="225" x2="342" y2="258" stroke="#93c5fd"/>
  <line x1="428" y1="225" x2="428" y2="258" stroke="#93c5fd"/>
  <line x1="514" y1="225" x2="514" y2="258" stroke="#93c5fd"/>
  <text x="620" y="247" class="label" fill="#1d4ed8">训练</text>

  <text x="75" y="305" class="code">episode 1</text>
  <rect x="170" y="284" width="430" height="35" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <line x1="256" y1="285" x2="256" y2="318" stroke="#86efac"/>
  <line x1="342" y1="285" x2="342" y2="318" stroke="#86efac"/>
  <line x1="428" y1="285" x2="428" y2="318" stroke="#86efac"/>
  <line x1="514" y1="285" x2="514" y2="318" stroke="#86efac"/>
  <text x="620" y="307" class="label" fill="#15803d">评估</text>

  <rect x="70" y="339" width="570" height="34" rx="17" fill="#f1f5f9"/>
  <text x="355" y="361" text-anchor="middle" class="body">两个 episode 只能演示机制，不能构成稳定 benchmark。</text>

  <line x1="700" y1="160" x2="700" y2="365" stroke="#e2e8f0" stroke-width="2"/>

  <text x="750" y="178" class="label">错误：随机打散相邻 frame</text>
  <text x="750" y="204" class="small">两侧出现近乎重复的 observation</text>

  <text x="755" y="245" class="code">episode 0</text>
  <g transform="translate(850 224)">
    <rect x="0" y="0" width="72" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="72" y="0" width="72" height="35" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="144" y="0" width="72" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="216" y="0" width="72" height="35" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="288" y="0" width="72" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="360" y="0" width="72" height="35" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  </g>
  <text x="1080" y="294" text-anchor="middle" class="body">训练 · 评估 · 训练 · 评估 · ...</text>
  <text x="1080" y="323" text-anchor="middle" class="label" fill="#be123c">trajectory 泄漏</text>
  <path d="M842 215 L1308 276" class="cross"/>
  <path d="M1308 215 L842 276" class="cross"/>
  <rect x="820" y="339" width="520" height="34" rx="17" fill="#fff1f2"/>
  <text x="1080" y="361" text-anchor="middle" class="body">Frame 不重叠不等于 trajectory 独立。</text>

  <rect x="30" y="418" width="1340" height="352" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="55" y="452" class="section">B · H = 4 的未来 action window</text>

  <text x="70" y="494" class="label">中段 frame：四个真实 target</text>
  <text x="70" y="522" class="small">所有查询 index 都位于 episode 0 内</text>

  <g transform="translate(70 548)">
    <rect x="0" y="0" width="100" height="58" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="115" y="0" width="100" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="230" y="0" width="100" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="345" y="0" width="100" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="460" y="0" width="100" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="575" y="0" width="100" height="58" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="50" y="35" text-anchor="middle" class="code">a_(t-1)</text>
    <text x="165" y="35" text-anchor="middle" class="code">a_t</text>
    <text x="280" y="35" text-anchor="middle" class="code">a_(t+1)</text>
    <text x="395" y="35" text-anchor="middle" class="code">a_(t+2)</text>
    <text x="510" y="35" text-anchor="middle" class="code">a_(t+3)</text>
    <text x="625" y="35" text-anchor="middle" class="code">a_(t+4)</text>
  </g>
  <text x="350" y="640" text-anchor="middle" class="code">action_is_pad = [false, false, false, false]</text>
  <text x="350" y="669" text-anchor="middle" class="small">5 FPS：H/fps = 0.8 s；最后一个 offset = (H−1)/fps = 0.6 s</text>

  <line x1="735" y1="480" x2="735" y2="728" stroke="#e2e8f0" stroke-width="2"/>

  <text x="780" y="494" class="label">最后一帧：保持 shape，并 mask 复制值</text>
  <text x="780" y="522" class="small">绝不把下一 episode 当作本 episode 的未来</text>

  <g transform="translate(780 548)">
    <rect x="0" y="0" width="125" height="58" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="140" y="0" width="125" height="58" rx="9" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="280" y="0" width="125" height="58" rx="9" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="420" y="0" width="125" height="58" rx="9" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="62" y="35" text-anchor="middle" class="code">a_last</text>
    <text x="202" y="35" text-anchor="middle" class="code">a_last</text>
    <text x="342" y="35" text-anchor="middle" class="code">a_last</text>
    <text x="482" y="35" text-anchor="middle" class="code">a_last</text>
  </g>
  <text x="1052" y="640" text-anchor="middle" class="code">action_is_pad = [false, true, true, true]</text>
  <rect x="820" y="661" width="465" height="50" rx="13" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1052" y="682" text-anchor="middle" class="body">重复值用于补齐 shape，不是 demonstration。</text>
  <text x="1052" y="702" text-anchor="middle" class="small">从有效训练 target 中排除被 mask 的 row。</text>

  <path d="M687 735 H760" class="flow"/>
  <text x="723" y="755" text-anchor="middle" class="small">同一个 episode 边界</text>
</svg>
