name: Validate course

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python validation environment
        run: |
          uv sync --only-group dev --locked
          uv pip install --python .venv/bin/python --no-deps --editable .

      - name: Validate bilingual course contracts
        run: .venv/bin/python -m robo_genesis.course_validation

      - name: Run Python tests
        run: .venv/bin/python -m pytest

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src scripts tests

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build
