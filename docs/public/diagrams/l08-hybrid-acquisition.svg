<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">A hybrid route for scaling robot demonstrations</title>
  <desc id="desc">High-value human demonstrations, simulation generation, and broader visual experience pass through execution and quality gates before heterogeneous datasets are used downstream.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .heading { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 650 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="590" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Recent acquisition systems combine complementary sources</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">Scale is useful only when embodiment, execution, timing, and outcome remain explicit.</text>

  <rect x="42" y="132" width="244" height="112" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="164" y="164" text-anchor="middle" class="heading">Human-guided seeds</text>
  <text x="164" y="194" text-anchor="middle" class="small">teleoperation</text>
  <text x="164" y="218" text-anchor="middle" class="small">kinesthetic / portable capture</text>

  <rect x="42" y="300" width="244" height="112" rx="16" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="164" y="332" text-anchor="middle" class="heading">Broader experience</text>
  <text x="164" y="362" text-anchor="middle" class="small">human and egocentric video</text>
  <text x="164" y="386" text-anchor="middle" class="small">heterogeneous robot datasets</text>

  <rect x="355" y="132" width="244" height="280" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="477" y="168" text-anchor="middle" class="heading">Automated scaling</text>
  <rect x="385" y="194" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="477" y="222" text-anchor="middle" class="label">scripted expert</text>
  <rect x="385" y="256" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="477" y="284" text-anchor="middle" class="label">learned teacher</text>
  <rect x="385" y="318" width="184" height="60" rx="8" fill="#ffffff"/>
  <text x="477" y="343" text-anchor="middle" class="label">seed-based</text>
  <text x="477" y="364" text-anchor="middle" class="label">augmentation</text>

  <rect x="668" y="132" width="244" height="280" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="790" y="168" text-anchor="middle" class="heading">Quality gates</text>
  <rect x="698" y="194" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="790" y="222" text-anchor="middle" class="label">retarget + replay</text>
  <rect x="698" y="256" width="184" height="44" rx="8" fill="#ffffff"/>
  <text x="790" y="284" text-anchor="middle" class="label">physical execution</text>
  <rect x="698" y="318" width="184" height="60" rx="8" fill="#ffffff"/>
  <text x="790" y="343" text-anchor="middle" class="label">outcome + data</text>
  <text x="790" y="364" text-anchor="middle" class="label">quality checks</text>

  <rect x="981" y="132" width="177" height="280" rx="16" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1069" y="168" text-anchor="middle" class="heading">Accepted mixture</text>
  <text x="1069" y="211" text-anchor="middle" class="small">robot-native action</text>
  <text x="1069" y="239" text-anchor="middle" class="small">aligned observation</text>
  <text x="1069" y="267" text-anchor="middle" class="small">task metadata</text>
  <text x="1069" y="295" text-anchor="middle" class="small">outcome label</text>
  <line x1="1009" y1="322" x2="1129" y2="322" stroke="#7dd3fc" stroke-width="2"/>
  <text x="1069" y="352" text-anchor="middle" class="small">cross-embodiment</text>
  <text x="1069" y="376" text-anchor="middle" class="small">only when semantics</text>
  <text x="1069" y="398" text-anchor="middle" class="small">are explicit</text>

  <path d="M286 188 H347" class="arrow"/>
  <path d="M286 356 H320 V360 H347" class="arrow"/>
  <path d="M599 272 H660" class="arrow"/>
  <path d="M912 272 H973" class="arrow"/>

  <rect x="315" y="465" width="570" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <text x="600" y="494" text-anchor="middle" class="label">Iteration loop</text>
  <text x="600" y="518" text-anchor="middle" class="small">failures and uncovered tasks guide the next human seed, script, or teacher</text>
  <path d="M1069 420 V500 H894" class="arrow"/>
  <path d="M306 500 H164 V421" class="arrow"/>

  <text x="600" y="567" text-anchor="middle" class="subtitle">L08 studies one transparent scripted branch; later lessons define storage and policy use.</text>
</svg>
